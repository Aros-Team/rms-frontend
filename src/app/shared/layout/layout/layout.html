<a
  href="#main"
  class="sr-only focus:not-sr-only focus:fixed focus:left-2 focus:top-2 focus:z-[200] focus:rounded-lg focus:border focus:border-surface-300 focus:bg-primary-contrast focus:px-4 focus:py-2 focus:text-sm focus:font-semibold focus:text-surface-900"
>
  Saltar al contenido
</a>

<div class="flex h-dvh flex-col bg-surface-50 pt-16 dark:bg-surface-900">
  <app-header
    [isMobile]="isMobile"
    [role]="role"
    [workerType]="workerType"
    [menuOpen]="sidebarVisible && isMobile"
    [hideTabletNav]="isTablet"
    (toggleMenu)="toggleSidebar()">
  </app-header>

  <app-restricted-banner />
  <app-server-down-banner />

  <div class="relative flex min-h-0 flex-1 overflow-hidden">
    <main
      id="main"
      tabindex="-1"
      class="mt-1 mb-[0.5rem] flex min-w-0 flex-1 flex-col rounded-lg border border-surface-300 dark:border-surface-700 md:rounded-2xl lg:mb-[1rem]"
      [ngClass]="{
        'ml-0.5 md:ml-2 mr-0.5 md:mr-2 lg:mr-[1rem]': !hideSidebar,
        'mx-auto px-4 max-w-7xl w-full': hideSidebar
      }">

      <div class="flex-1 min-h-0 overflow-y-auto p-1 md:p-2 lg:p-3">
        <ng-content></ng-content>
      </div>
    </main>

    @if (!hideSidebar) {
      <app-sidebar
        [visible]="drawerVisible"
        [isMobile]="isMobile"
        [isOverlay]="isMobile"
        [expanded]="isChatOpen"
        [chatTemplate]="chatTemplate"
        (visibleChange)="onSidebarVisibleChange($event)"
        (toggleChat)="toggleChatEvent.emit()">
      </app-sidebar>
    }
  </div>

</div>
