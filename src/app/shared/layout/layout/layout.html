<a
  href="#main"
  class="sr-only focus:not-sr-only focus:fixed focus:left-2 focus:top-2 focus:z-[var(--rms-z-toast)] focus:rounded-lg focus:border focus:border-rms-border-strong focus:bg-rms-surface focus:px-4 focus:py-2 focus:text-sm focus:font-semibold focus:text-rms-ink"
>
  Saltar al contenido
</a>

<div class="flex h-dvh flex-col bg-rms-page pt-[calc(4.5rem+env(safe-area-inset-top))]">
  <app-header
    [isMobile]="isMobile"
    [role]="role"
    [workerType]="workerType"
    [menuOpen]="sidebarVisible && isMobile"
    [hideTabletNav]="isTablet"
    (toggleMenu)="toggleSidebar()"
  >
  </app-header>

  <app-restricted-banner />
  <app-server-down-banner />

  <div class="relative flex min-h-0 flex-1 overflow-hidden">
    <main
      id="main"
      tabindex="-1"
      class="mt-1 mb-2 flex min-w-0 flex-1 flex-col rounded-lg border border-rms-border-strong md:rounded-2xl lg:mb-4"
      [ngClass]="{
        'ml-0.5 md:ml-2 mr-0.5 md:mr-2 lg:mr-4': !hideSidebar,
        'mx-auto px-4 max-w-7xl w-full': hideSidebar,
      }"
    >
      <div class="flex-1 min-h-0 overflow-y-auto p-1 md:p-2 lg:p-3">
        <ng-content></ng-content>
      </div>
    </main>

    @if (!hideSidebar) {
      <app-sidebar
        [visible]="drawerVisible"
        [isMobile]="isMobile"
        [isOverlay]="isMobile"
        [expanded]="isChatOpen"
        [chatTemplate]="chatTemplate"
        (visibleChange)="onSidebarVisibleChange($event)"
        (toggleChat)="toggleChatEvent.emit()"
      >
      </app-sidebar>
    }
  </div>
</div>
