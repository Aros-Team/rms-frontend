<a
  href="#main"
  class="sr-only focus:not-sr-only focus:fixed focus:left-2 focus:top-2 focus:z-[var(--rms-z-toast)] focus:rounded-lg focus:border focus:border-rms-border-strong focus:bg-rms-surface focus:px-4 focus:py-2 focus:text-sm focus:font-semibold focus:text-rms-ink"
>
  Saltar al contenido
</a>

<div class="flex min-h-dvh flex-col bg-rms-page pt-[calc(4.5rem+env(safe-area-inset-top))]">
  <app-header
    [isMobile]="true"
    [role]="role()"
    [workerType]="workerType()"
    [hideTabletNav]="true"
  />

  <app-server-down-banner />

  @if (accessibleModules().length > 1) {
    <nav
      class="mx-auto flex w-full max-w-7xl flex-wrap gap-2 px-3 pt-3"
      aria-label="Módulos de trabajo"
    >
      @for (module of accessibleModules(); track module.id) {
        <a
          [routerLink]="module.home"
          [attr.aria-current]="workerType() === module.id ? 'page' : null"
          class="inline-flex items-center gap-2 rounded-full border px-3 py-1.5 text-sm font-medium transition-colors"
          [ngClass]="
            workerType() === module.id
              ? 'border-rms-brand bg-rms-brand-soft text-rms-brand-text'
              : 'border-rms-border bg-rms-surface text-rms-ink-secondary hover:bg-rms-subtle'
          "
        >
          <i [class]="module.icon + ' text-sm'" aria-hidden="true"></i>
          <span>{{ module.label }}</span>
        </a>
      }
    </nav>
  }

  <main
    id="main"
    tabindex="-1"
    class="flex flex-1 flex-col px-3 pt-4 lg:order-2"
    [ngClass]="isKitchen() ? 'pb-4 kitchen-main' : 'pb-28 lg:pb-4'"
  >
    <div class="mx-auto flex w-full min-h-0 flex-1 flex-col" [ngClass]="isKitchen() ? '' : 'max-w-7xl'">
      @if (!isKitchen()) {
        <app-breadcrumbs class="mb-2 block px-1" />
      }
      <ng-content />
    </div>
  </main>

  @if (navItems().length > 0) {
    <nav
      class="fixed inset-x-0 bottom-0 z-[var(--rms-z-sticky)] border-t border-rms-border bg-rms-page pb-[env(safe-area-inset-bottom)] lg:order-1 lg:static lg:inset-auto lg:z-auto lg:border-t-0 lg:border-b lg:bg-transparent lg:pb-0"
      aria-label="Navegación de servicio"
    >
      <ul class="mx-auto flex w-full max-w-3xl items-stretch lg:max-w-7xl lg:items-center lg:gap-1 lg:px-3 lg:pt-3 lg:pb-1">
        @for (item of navItems(); track item.id) {
          <li class="flex min-w-0 flex-1 lg:flex-none">
            <a
              [routerLink]="item.routerLink"
              [queryParams]="item.queryParams ?? {}"
              [attr.aria-current]="isActive(item) ? 'page' : null"
              class="rms-nav-item rms-nav-item--bottom"
              [ngClass]="isActive(item) ? 'rms-nav-item--active' : ''"
            >
              <i [class]="item.icon + ' text-lg'" aria-hidden="true"></i>
              <span class="truncate">{{ item.label }}</span>
            </a>
          </li>
        }
      </ul>
    </nav>
  }
</div>
