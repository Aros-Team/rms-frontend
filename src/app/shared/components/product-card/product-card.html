@if (loading) {
  <div class="flex flex-col gap-2 w-full max-w-[180px]">
    <p-skeleton width="100%" height="100px" borderRadius="12px" />
    <p-skeleton width="80%" height="16px" />
    <p-skeleton width="60%" height="14px" />
  </div>
} @else {
  <div
    class="flex flex-col w-full border rounded-xl bg-rms-surface overflow-hidden transition-colors"
    [class.border-rms-border]="!selected"
    [class.border-rms-brand-text]="selected"
    [class.opacity-50]="disabled"
    [class.pointer-events-none]="disabled || unavailable"
    [class.cursor-pointer]="!disabled && !unavailable"
    (click)="onToggle()"
    (keydown.enter)="onToggle($event)"
    (keydown.space)="onToggle($event)"
    [tabindex]="disabled ? -1 : 0"
    role="option"
    [attr.aria-selected]="selected"
  >
    <div class="relative w-full aspect-square bg-rms-subtle">
      @if (product?.imageUrl) {
        <img
          [src]="imageSrc"
          [attr.srcset]="imageSrcSet"
          sizes="(min-width: 1280px) 180px, (min-width: 768px) 160px, 45vw"
          [alt]="product?.name ?? ''"
          width="600"
          height="600"
          class="w-full h-full object-contain"
          loading="lazy"
          decoding="async"
          (error)="$any($event.target).src = defaultImage"
        />
      } @else {
        <img
          [src]="defaultImage"
          [alt]="product?.name ?? ''"
          width="600"
          height="600"
          class="w-full h-full object-contain"
          loading="lazy"
          decoding="async"
        />
      }

      @if (selected) {
        <div class="absolute inset-0 bg-rms-brand/20 flex items-center justify-center">
          <i class="pi pi-check-circle text-accent text-2xl" aria-hidden="true"></i>
        </div>
      }

      @if (unavailable) {
        <div class="absolute top-2 left-2 bg-rms-ink-secondary text-rms-ink-inverse text-xs font-bold px-2 py-0.5 rounded">
          No disponible
        </div>
      }
    </div>

    <div class="flex flex-col gap-1 p-2">
      <span class="text-xs sm:text-sm font-medium text-rms-ink truncate leading-tight">{{ product?.name }}</span>
      <span class="text-xs sm:text-sm font-semibold text-muted" [class.line-through]="unavailable">
        {{ product?.basePrice | money }}
      </span>
    </div>
  </div>
}
