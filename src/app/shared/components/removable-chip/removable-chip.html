<div class="inline-flex items-center gap-2 px-3 py-2 rounded-full border-2 border-rms-border bg-rms-subtle transition-all">
  @if (chip.icon) {
    <i class="pi text-sm" [class]="chip.icon" aria-hidden="true"></i>
  }
  <span class="text-sm font-medium text-rms-ink">{{ chip.label }}</span>
  @if (chip.meta) {
    <span class="text-xs font-medium text-accent">{{ chip.meta }}</span>
  }
  <button
    type="button"
    class="w-5 h-5 flex items-center justify-center rounded-full text-rms-ink-muted hover:text-rms-ink transition-colors"
    [class.opacity-50]="chip.disabled"
    [class.cursor-not-allowed]="chip.disabled"
    [disabled]="chip.disabled"
    (click)="onRemove($event)"
    aria-label="Quitar">
    <i class="pi pi-times text-xs" aria-hidden="true"></i>
  </button>
</div>
