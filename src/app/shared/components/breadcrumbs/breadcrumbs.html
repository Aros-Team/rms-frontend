@if (crumbs().length > 1) {
  <nav aria-label="Ruta de navegación" class="min-w-0">
    <ol class="rms-caption flex min-w-0 flex-wrap items-center gap-1">
      @for (crumb of crumbs(); track crumb.url) {
        <li class="flex min-w-0 items-center gap-1">
          @if (crumb.current) {
            <span aria-current="page" class="truncate font-medium text-rms-ink">
              {{ crumb.label }}
            </span>
          } @else {
            <a [routerLink]="crumb.url" class="truncate hover:underline">{{ crumb.label }}</a>
            <i class="pi pi-angle-right text-[0.6rem]" aria-hidden="true"></i>
          }
        </li>
      }
    </ol>
  </nav>
}
