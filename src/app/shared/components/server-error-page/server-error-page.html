<div class="min-h-screen bg-surface-50 dark:bg-surface-900 flex items-center justify-center p-4">
  <div class="max-w-md w-full text-center">
    <div class="w-24 h-24 mx-auto mb-6 rounded-full bg-red-100 dark:bg-red-900/30 flex items-center justify-center">
      <i class="pi pi-exclamation-triangle text-5xl text-red-500"></i>
    </div>

    <h1 class="text-3xl font-bold text-surface-800 dark:text-surface-100 mb-3">
      500 — Error de conexión
    </h1>

    <p class="text-surface-600 dark:text-surface-400 leading-relaxed mb-8">
      El servidor está presentando inconvenientes. Estamos trabajando para restablecer la conexión. Por favor, intenta de nuevo más tarde.
    </p>

    <div class="flex flex-col sm:flex-row gap-3 justify-center">
      <p-button
        label="Reintentar"
        icon="pi pi-refresh"
        severity="warn"
        [loading]="serverStatus.isChecking()"
        (onClick)="retry()"
        styleClass="font-medium px-6" />

      <p-button
        label="Cerrar sesión"
        icon="pi pi-sign-out"
        severity="secondary"
        [text]="true"
        (onClick)="logout()"
        styleClass="font-medium" />
    </div>
  </div>
</div>
