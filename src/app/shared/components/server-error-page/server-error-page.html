<main
  id="main"
  tabindex="-1"
  class="flex min-h-dvh items-center justify-center bg-surface-50 p-4 dark:bg-surface-900"
>
  <div class="w-full max-w-md text-center">
    <div
      class="mx-auto mb-6 flex h-24 w-24 items-center justify-center rounded-full bg-red-100 dark:bg-red-900/30"
    >
      <i class="pi pi-exclamation-triangle text-5xl text-red-500" aria-hidden="true"></i>
    </div>

    <h1 class="mb-3 text-3xl font-bold text-surface-800 dark:text-surface-100">
      500 — Servidor no disponible
    </h1>

    <p class="mb-8 leading-relaxed text-muted">
      No pudimos comunicarnos con el servidor. Revisa tu conexión e intenta de nuevo; si el
      problema continúa, contacta al administrador del restaurante.
    </p>

    <div class="flex flex-col justify-center gap-3 sm:flex-row">
      <p-button
        label="Reintentar"
        icon="pi pi-refresh"
        severity="warn"
        [loading]="serverStatus.isChecking()"
        (onClick)="retry()"
        styleClass="font-medium px-6"
      />

      <p-button
        label="Cerrar sesión"
        icon="pi pi-sign-out"
        severity="secondary"
        [text]="true"
        (onClick)="logout()"
        styleClass="font-medium"
      />
    </div>
  </div>
</main>
