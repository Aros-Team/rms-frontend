<main id="main" tabindex="-1" class="flex min-h-dvh items-center justify-center bg-rms-page p-4">
  <div class="w-full max-w-md text-center">
    <div
      class="rms-status-surface--danger mx-auto mb-6 flex h-24 w-24 items-center justify-center rounded-full"
    >
      <i class="pi pi-exclamation-triangle text-5xl" aria-hidden="true"></i>
    </div>

    <h1 class="rms-h1 mb-3 text-rms-ink">500 — Servidor no disponible</h1>

    <p class="mb-8 leading-relaxed text-rms-ink-secondary">
      No pudimos comunicarnos con el servidor. Revisa tu conexión e intenta de nuevo; si el problema
      continúa, contacta al administrador del restaurante.
    </p>

    <div class="flex flex-col justify-center gap-3 sm:flex-row">
      <app-rms-button
        iconStart="pi pi-refresh"
        [loading]="serverStatus.isChecking()"
        (click)="retry()"
      >
        Reintentar
      </app-rms-button>

      <app-rms-button variant="ghost" iconStart="pi pi-sign-out" (click)="logout()">
        Cerrar sesión
      </app-rms-button>
    </div>
  </div>
</main>
