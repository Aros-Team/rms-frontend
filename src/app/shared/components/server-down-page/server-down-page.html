<div class="flex flex-col items-center justify-center min-h-[60vh] gap-6 p-8">
  <div class="w-20 h-20 rounded-full bg-red-100 dark:bg-red-900/30 flex items-center justify-center">
    <i class="pi pi-exclamation-triangle text-4xl text-red-500"></i>
  </div>

  <div class="text-center max-w-md">
    <h2 class="text-2xl font-bold text-surface-800 dark:text-surface-100 mb-3">
      Servicio temporalmente no disponible
    </h2>
    <p class="text-surface-600 dark:text-surface-400 leading-relaxed">
      El servidor está presentando inconvenientes. Por favor, ten paciencia, estamos trabajando para solucionarlo.
    </p>
  </div>

  <p-button
    label="Reintentar conexión"
    icon="pi pi-refresh"
    severity="warn"
    [loading]="serverStatus.isChecking()"
    (onClick)="serverStatus.check()"
    styleClass="font-medium" />
</div>
