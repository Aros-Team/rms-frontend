<div class="flex flex-col items-center justify-center min-h-[60vh] gap-6 p-8">
  <div class="rms-status-surface--danger w-20 h-20 rounded-full flex items-center justify-center">
    <i class="pi pi-exclamation-triangle text-4xl" aria-hidden="true"></i>
  </div>

  <div class="text-center max-w-md">
    <h2 class="rms-h2 text-rms-ink mb-3">
      Servicio temporalmente no disponible
    </h2>
    <p class="text-rms-ink-secondary leading-relaxed">
      El servidor está presentando inconvenientes. Por favor, ten paciencia, estamos trabajando para solucionarlo.
    </p>
  </div>

  <app-rms-button
    iconStart="pi pi-refresh"
    [loading]="serverStatus.isChecking()"
    (click)="serverStatus.check()">
    Reintentar conexión
  </app-rms-button>
</div>
