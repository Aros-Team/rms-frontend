<aside
    id="app-sidebar"
    [attr.inert]="visible ? null : ''"
    [attr.aria-hidden]="visible ? null : 'true'"
    class="admin-panel bg-rms-page flex flex-col pt-[env(safe-area-inset-top)]
    fixed inset-0 w-full h-full z-[var(--rms-z-drawer)] transition-transform duration-300 ease-in-out
    translate-x-full md:translate-x-0
    md:relative md:inset-auto md:h-full md:z-auto md:shrink-0 md:mb-4"
    [class.translate-x-0]="visible"
    [class.translate-x-full]="!visible"
    [class.admin-panel--expanded]="expanded">

    <div class="flex items-center justify-between gap-2 p-4 md:hidden" [class.hidden]="expanded">
        <span class="text-sm font-semibold text-rms-ink">Menú</span>
        <button class="p-2 rounded-lg hover:bg-rms-subtle transition-colors"
            (click)="closeSidebar()" aria-label="Cerrar menú">
            <i class="pi pi-times text-muted text-xl" aria-hidden="true"></i>
        </button>
    </div>

    <nav aria-label="Navegación principal" class="min-w-0 px-2 pt-2 lg:px-3">
        <ul class="nav-grid" [class.nav-grid--expanded]="expanded">
            @for (item of menuItems; track item.id; let i = $index) {
                <li class="nav-grid__item" [style.animation-delay.ms]="expanded ? i * 30 : 0">
                    <a [routerLink]="item.routerLink"
                        #rla="routerLinkActive"
                        routerLinkActive="rms-nav-item--active"
                        [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
                        [attr.aria-current]="rla.isActive ? 'page' : null"
                        class="rms-nav-item rms-nav-item--tile nav-tile cursor-pointer"
                        [attr.title]="expanded ? null : item.label"
                        (click)="onMenuItemClick(item)">
                        @if (item.icon) {
                            <i [class]="item.icon + ' text-lg'" aria-hidden="true"></i>
                        }
                        <span class="nav-tile__label rms-nav-item__label !text-[0.5625rem]">{{ item.label }}</span>
                    </a>
                </li>
            }
        </ul>
    </nav>

    <div class="mt-auto p-2 lg:px-3 lg:pb-3" [class.hidden]="expanded">
        <button
            type="button"
            class="rms-nav-item rms-nav-item--tile nav-tile w-full cursor-pointer"
            (click)="toggleChat.emit()"
            aria-label="Abrir asistente ABI"
            title="Asistente ABI">
            <i class="pi pi-comments text-lg" aria-hidden="true"></i>
            <span class="nav-tile__label rms-nav-item__label !text-[0.5625rem]">Asistente</span>
        </button>
    </div>

    <div
        class="mt-2 flex min-h-0 flex-1 flex-col overflow-hidden border-t border-rms-border"
        [class.hidden]="!expanded"
        [attr.inert]="expanded ? null : ''"
        [attr.aria-hidden]="expanded ? null : 'true'">
        <!-- Docked assistant. The shell declares the view so this layout
             stays free of feature imports. -->
        @if (chatTemplate) {
            <ng-container [ngTemplateOutlet]="chatTemplate"></ng-container>
        }
    </div>

</aside>
