<p-popover
  #popover
  (onShow)="onPopoverShow()"
  (onHide)="onPopoverHide()"
  [dismissable]="true"
  [style]="{ minWidth: '320px', maxWidth: '400px' }">

  <ng-template pTemplate="content">
    <div class="flex flex-col gap-3 p-2">
      <div class="flex items-center justify-between pb-2 border-b border-rms-border">
        <h4 class="font-semibold text-rms-ink">{{ title }}</h4>
        <button
          type="button"
          class="p-1 rounded-lg text-rms-ink-secondary hover:bg-rms-subtle"
          (click)="close()"
          aria-label="Cerrar">
          <i class="pi pi-times" aria-hidden="true"></i>
        </button>
      </div>

      <div class="flex flex-col gap-3">
        @for (field of fields; track field.name) {
          @switch (field.type) {
            @case ('text') {
              <app-rms-input
                [id]="'inline-create-' + field.name"
                [label]="field.label"
                [placeholder]="field.placeholder ?? ''"
                [required]="!!field.required"
                [(ngModel)]="formValues[field.name]" />
            }
            @case ('number') {
              <app-rms-field
                [label]="field.label"
                [controlId]="'inline-create-' + field.name"
                [required]="!!field.required">
                <p-inputNumber
                  [inputId]="'inline-create-' + field.name"
                  [ngModel]="formValues[field.name]"
                  (ngModelChange)="formValues[field.name] = $event"
                  [placeholder]="field.placeholder"
                  [showButtons]="true"
                  [required]="!!field.required"
                  mode="decimal"
                  class="w-full" />
              </app-rms-field>
            }
            @case ('select') {
              <app-rms-field
                [label]="field.label"
                [controlId]="'inline-create-' + field.name"
                [required]="!!field.required">
                <p-select
                  [options]="field.options"
                  [(ngModel)]="formValues[field.name]"
                  [placeholder]="field.placeholder"
                  [inputId]="'inline-create-' + field.name"
                  [required]="!!field.required"
                  class="w-full"
                  optionLabel="label"
                  optionValue="value" />
              </app-rms-field>
            }
          }
        }
      </div>

      <div class="flex justify-end gap-2 pt-2 border-t border-rms-border">
        <app-rms-button
          variant="secondary"
          (click)="close()"
          [disabled]="submitting()">{{ cancelLabel }}</app-rms-button>
        <app-rms-button
          (click)="onSubmit()"
          [disabled]="submitting()">{{ submitLabel }}</app-rms-button>
      </div>
    </div>
  </ng-template>
</p-popover>
