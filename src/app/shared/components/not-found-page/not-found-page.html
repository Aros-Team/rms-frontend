<main
  id="main"
  tabindex="-1"
  class="flex min-h-dvh items-center justify-center bg-rms-page p-4"
>
  <div class="w-full max-w-md text-center">
    <div
      class="mx-auto mb-6 flex h-24 w-24 items-center justify-center rounded-full bg-rms-subtle"
    >
      <i class="pi pi-compass text-5xl text-rms-ink-muted" aria-hidden="true"></i>
    </div>

    <h1 class="rms-h1 mb-3 text-rms-ink">
      404 — Página no encontrada
    </h1>

    <p class="mb-8 leading-relaxed text-rms-ink-secondary">
      La dirección a la que intentas entrar no existe o cambió de lugar. Revisa el enlace o vuelve
      al inicio para seguir trabajando.
    </p>

    <div class="flex flex-col justify-center gap-3 sm:flex-row">
      <app-rms-button iconStart="pi pi-home" (click)="goHome()">Volver al inicio</app-rms-button>

      @if (hasSession()) {
        <app-rms-button variant="ghost" iconStart="pi pi-sign-out" (click)="logout()">
          Cerrar sesión
        </app-rms-button>
      }
    </div>
  </div>
</main>
