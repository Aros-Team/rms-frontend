<div class="min-h-screen bg-surface-50 dark:bg-surface-900 flex items-center justify-center p-4">
  <div class="max-w-md w-full text-center">
    <div
      class="w-24 h-24 mx-auto mb-6 rounded-full bg-surface-200 dark:bg-surface-800 flex items-center justify-center"
    >
      <i class="pi pi-compass text-5xl text-surface-500 dark:text-surface-400" aria-hidden="true"></i>
    </div>

    <h1 class="text-3xl font-bold text-surface-800 dark:text-surface-100 mb-3">
      404 — Página no encontrada
    </h1>

    <p class="text-surface-600 dark:text-surface-400 leading-relaxed mb-8">
      La dirección a la que intentas entrar no existe o cambió de lugar. Revisa el enlace o vuelve
      al inicio para seguir trabajando.
    </p>

    <div class="flex flex-col sm:flex-row gap-3 justify-center">
      <p-button
        label="Volver al inicio"
        icon="pi pi-home"
        (onClick)="goHome()"
        styleClass="font-medium px-6"
      />

      @if (hasSession()) {
        <p-button
          label="Cerrar sesión"
          icon="pi pi-sign-out"
          severity="secondary"
          [text]="true"
          (onClick)="logout()"
          styleClass="font-medium"
        />
      }
    </div>
  </div>
</div>
