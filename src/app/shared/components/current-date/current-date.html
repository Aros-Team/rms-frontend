<div class="current-date bg-rms-subtle lg:border-t lg:border-t-rms-border">
  <p-datepicker
    [(ngModel)]="currentDate"
    [inline]="true"
    [readonlyInput]="true"
    [showIcon]="true"
    [showWeek]="false"
    [disabled]="false"
    [maxDate]="maxDate"
    [minDate]="minDate"
  >
  </p-datepicker>
</div>
