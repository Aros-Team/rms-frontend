<div class="min-h-screen bg-surface-50 dark:bg-surface-900 flex items-center justify-center p-4">
  <div class="max-w-md w-full text-center">
    <div
      class="w-24 h-24 mx-auto mb-6 rounded-full bg-amber-100 dark:bg-amber-900/30 flex items-center justify-center"
    >
      <i class="pi pi-lock text-5xl text-amber-500" aria-hidden="true"></i>
    </div>

    <h1 class="text-3xl font-bold text-surface-800 dark:text-surface-100 mb-3">
      403 — Acceso restringido
    </h1>

    <p class="text-muted leading-relaxed mb-8">
      Tu sesión es válida, pero no tienes permisos para entrar a esta sección. Si crees que es un
      error, contacta al administrador del restaurante.
    </p>

    <div class="flex flex-col sm:flex-row gap-3 justify-center">
      <p-button
        label="Volver al inicio"
        icon="pi pi-home"
        severity="warn"
        (onClick)="goHome()"
        styleClass="font-medium px-6"
      />

      <p-button
        label="Cerrar sesión"
        icon="pi pi-sign-out"
        severity="secondary"
        [text]="true"
        (onClick)="logout()"
        styleClass="font-medium"
      />
    </div>
  </div>
</div>
