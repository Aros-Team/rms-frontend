<main id="main" tabindex="-1" class="flex min-h-dvh items-center justify-center bg-rms-page p-4">
  <div class="w-full max-w-md text-center">
    <div
      class="rms-status-surface--warning mx-auto mb-6 flex h-24 w-24 items-center justify-center rounded-full"
    >
      <i class="pi pi-lock text-5xl" aria-hidden="true"></i>
    </div>

    <h1 class="rms-h1 mb-3 text-rms-ink">403 — Acceso restringido</h1>

    <p class="mb-8 leading-relaxed text-rms-ink-secondary">
      Tu sesión es válida, pero no tienes permisos para entrar a esta sección. Si crees que es un
      error, contacta al administrador del restaurante.
    </p>

    <div class="flex flex-col justify-center gap-3 sm:flex-row">
      <app-rms-button iconStart="pi pi-home" (click)="goHome()">Volver al inicio</app-rms-button>

      <app-rms-button variant="ghost" iconStart="pi pi-sign-out" (click)="logout()">
        Cerrar sesión
      </app-rms-button>
    </div>
  </div>
</main>
