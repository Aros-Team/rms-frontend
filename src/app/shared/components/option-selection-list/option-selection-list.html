<div class="flex flex-col gap-2">
  @for (option of options; track option.id) {
    <div class="flex items-center gap-3 p-2 rounded-lg hover:bg-surface-50 dark:hover:bg-surface-800 transition-colors"
         [class.opacity-50]="option.disabled">

      @if (isRadio) {
        <p-radiobutton
          [name]="groupName"
          [value]="option.id"
          [ngModel]="isSelected(option.id)"
          (onChange)="onRadioChange(option.id)"
          [disabled]="!!option.disabled" />
      } @else {
        <p-checkbox
          [binary]="true"
          [ngModel]="isSelected(option.id)"
          (onChange)="onCheckboxChange(option.id, $event.checked)"
          [disabled]="!!option.disabled" />
      }

      <div class="flex-1 min-w-0">
        <span class="text-sm font-medium text-surface-800 dark:text-surface-100">{{ option.name }}</span>
        @if (option.extraPrice && option.extraPrice > 0) {
          <span class="text-xs text-primary-600 dark:text-primary-400 ml-2">+${{ option.extraPrice | number:'1.0-0' }}</span>
        }
      </div>
    </div>
  } @empty {
    <p class="text-sm text-surface-500 dark:text-surface-400 text-center py-4">No hay opciones disponibles</p>
  }
</div>
