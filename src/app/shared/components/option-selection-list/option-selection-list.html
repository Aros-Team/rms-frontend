<div class="flex flex-col gap-2">
  @for (option of options; track option.id) {
    <label class="option-row flex items-center gap-3 p-2 rounded-lg hover:bg-surface-50 dark:hover:bg-surface-800 transition-colors"
           [attr.for]="groupName + '-' + option.id"
           [class.opacity-50]="option.disabled">

      @if (isRadio) {
        <p-radiobutton
          [name]="groupName"
          [inputId]="groupName + '-' + option.id"
          [value]="option.id"
          [ngModel]="isSelected(option.id)"
          (onChange)="onRadioChange(option.id)"
          [disabled]="!!option.disabled" />
      } @else {
        <p-checkbox
          [binary]="true"
          [inputId]="groupName + '-' + option.id"
          [ngModel]="isSelected(option.id)"
          (onChange)="onCheckboxChange(option.id, $event.checked)"
          [disabled]="!!option.disabled" />
      }

      <div class="flex-1 min-w-0">
        <span class="text-sm font-medium text-surface-800 dark:text-surface-100">{{ option.name }}</span>
        @if (option.extraPrice && option.extraPrice > 0) {
          <span class="text-xs text-accent ml-2">+{{ option.extraPrice | money }}</span>
        }
      </div>
    </label>
  } @empty {
    <p class="text-sm text-muted text-center py-4">No hay opciones disponibles</p>
  }
</div>
