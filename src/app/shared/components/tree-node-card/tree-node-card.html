<div class="flex items-center gap-3 p-3 bg-rms-subtle rounded-xl border border-rms-border"
     [class.ml-6]="nodeType === 'group'"
     [class.ml-12]="nodeType === 'option'">

  @if (loading) {
    <div class="flex-1 flex items-center justify-center py-4">
      <i class="pi pi-spin pi-spinner text-accent text-xl" aria-hidden="true"></i>
    </div>
  } @else {
    @if (icon) {
      <i class="pi text-2xl shrink-0"
         [class]="icon"
         [class.text-accent]="nodeType === 'product' || nodeType === 'group'"
         [class.text-rms-ink-muted]="nodeType === 'option'" aria-hidden="true"></i>
    }

    <div class="flex-1 min-w-0">
      <h4 class="rms-h4 text-rms-ink truncate">{{ title }}</h4>
      @if (subtitle) {
        <p class="text-xs text-rms-ink-muted truncate">{{ subtitle }}</p>
      }
      @if (badges.length > 0) {
        <div class="flex flex-wrap gap-1.5 mt-2">
          @for (badge of badges; track badge.id) {
            <app-removable-chip [chip]="badge" (removed)="badgeRemoved.emit($event)" />
          }
        </div>
      }
    </div>

    @if (expandable) {
      <button
        type="button"
        class="p-2 rounded-full text-rms-ink-muted hover:text-rms-ink transition-colors shrink-0"
        (click)="expand.emit()"
        [attr.aria-expanded]="expanded"
        aria-label="Expandir">
        <i class="pi" [class]="expanded ? 'pi-chevron-up' : 'pi-chevron-down'" aria-hidden="true"></i>
      </button>
    }
  }
</div>
