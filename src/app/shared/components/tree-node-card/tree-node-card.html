<div class="flex items-center gap-3 p-3 bg-surface-50 dark:bg-surface-800 rounded-xl border border-surface-200 dark:border-surface-700"
     [class.border-l-4]="nodeType === 'product'"
     [class.border-l-primary]="nodeType === 'product'"
     [class.ml-6]="nodeType === 'group'"
     [class.ml-12]="nodeType === 'option'">

  @if (loading) {
    <div class="flex-1 flex items-center justify-center py-4">
      <i class="pi pi-spin pi-spinner text-primary-600 dark:text-primary-400 text-xl"></i>
    </div>
  } @else {
    @if (icon) {
      <i class="pi text-2xl shrink-0"
         [class]="icon"
         [class.text-primary-600]="nodeType === 'product'"
         [class.text-primary-500]="nodeType === 'group'"
         [class.text-surface-400]="nodeType === 'option'"></i>
    }

    <div class="flex-1 min-w-0">
      <h4 class="font-semibold text-surface-900 dark:text-surface-0 truncate text-sm">{{ title }}</h4>
      @if (subtitle) {
        <p class="text-xs text-surface-500 dark:text-surface-400 truncate">{{ subtitle }}</p>
      }
      @if (badges.length > 0) {
        <div class="flex flex-wrap gap-1.5 mt-2">
          @for (badge of badges; track badge.id) {
            <app-removable-chip [chip]="badge" (removed)="badgeRemoved.emit($event)" />
          }
        </div>
      }
    </div>

    @if (expandable) {
      <button
        type="button"
        class="p-2 rounded-full text-surface-400 hover:text-surface-600 dark:hover:text-surface-300 transition-colors shrink-0"
        (click)="expand.emit()"
        [attr.aria-expanded]="expanded"
        aria-label="Expandir">
        <i class="pi" [class]="expanded ? 'pi-chevron-up' : 'pi-chevron-down'"></i>
      </button>
    }
  }
</div>
