<div class="space-y-2" [style.padding-left.px]="depth * 24">
  @for (item of items; track $index) {
    <div class="bg-surface-50 dark:bg-surface-800 rounded-lg border border-surface-200 dark:border-surface-700 p-3">
      <div class="flex items-center gap-3">
        <p-skeleton shape="circle" [width]="'40px'" [height]="'40px'" />
        <div class="flex-1 space-y-2">
          <p-skeleton [width]="'60%'" [height]="'16px'" />
          <p-skeleton [width]="'40%'" [height]="'12px'" />
        </div>
      </div>
    </div>
  }
</div>
