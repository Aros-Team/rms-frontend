<app-rms-field
  [label]="label"
  [controlId]="selectId"
  [hint]="hint"
  [error]="error"
  [invalid]="invalid"
  [required]="required"
  [optionalLabel]="optionalLabel"
  [hideLabel]="hideLabel"
  [size]="size"
>
  <p-select
    styleClass="rms-select"
    [inputId]="selectId"
    [ariaLabelledBy]="labelledBy"
    [options]="options"
    optionLabel="label"
    optionValue="value"
    optionDisabled="disabled"
    [placeholder]="placeholder"
    [filter]="shouldFilter"
    [showClear]="showClear"
    [resetFilterOnHide]="true"
    [emptyMessage]="'Sin resultados'"
    [emptyFilterMessage]="'Sin coincidencias'"
    [appendTo]="'body'"
    [size]="primeSize"
    [disabled]="isDisabled"
    [pt]="pt"
    [ngModel]="value()"
    [ngModelOptions]="{ standalone: true }"
    (ngModelChange)="onModelChange($event)"
    (onBlur)="onBlur()"
  />
</app-rms-field>
