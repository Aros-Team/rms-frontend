<p-dialog
  [styleClass]="styleClass"
  [header]="header"
  [visible]="visible"
  (visibleChange)="visibleChange.emit($event)"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [blockScroll]="true"
  [closeOnEscape]="closeOnEscape"
  [dismissableMask]="dismissableMask"
  [closable]="closable"
  [showHeader]="showHeader"
  [focusOnShow]="true"
  [style]="dialogStyle"
>
  <div class="rms-dialog__body">
    <ng-content />
  </div>

  <div class="rms-dialog__footer">
    <ng-content select="[rmsDialogFooter]" />
  </div>
</p-dialog>
