<div class="px-1 py-1" role="status" aria-label="Cargando la carta">
  <p-skeleton width="100%" height="48px" styleClass="mb-3" borderRadius="8px" />

  <div class="flex gap-2 mb-3 overflow-x-auto">
    <p-skeleton width="70px" height="44px" borderRadius="999px" />
    <p-skeleton width="88px" height="44px" borderRadius="999px" />
    <p-skeleton width="72px" height="44px" borderRadius="999px" />
    <p-skeleton width="96px" height="44px" borderRadius="999px" />
  </div>

  <div class="flex flex-col gap-2">
    @for (_ of [1,2,3,4,5,6]; track $index) {
      <div class="flex items-center gap-3 rounded-xl border border-rms-border bg-rms-surface p-2">
        <p-skeleton width="60px" height="60px" borderRadius="8px" />
        <div class="flex flex-1 flex-col gap-2">
          <p-skeleton width="70%" height="0.95rem" />
          <p-skeleton width="45%" height="0.75rem" />
        </div>
        <p-skeleton width="44px" height="44px" borderRadius="999px" />
      </div>
    }
  </div>
</div>
