<div class="flex flex-col gap-2" role="status" aria-label="Cargando los pedidos de hoy">
  @for (_ of [1, 2, 3, 4]; track $index) {
    <div class="rounded-xl border border-rms-border bg-rms-surface p-3">
      <div class="mb-3 flex items-center justify-between gap-3">
        <div class="flex flex-col gap-2">
          <p-skeleton width="55px" height="1rem" />
          <p-skeleton width="140px" height="0.75rem" />
        </div>
        <p-skeleton width="80px" height="24px" borderRadius="999px" />
      </div>
      <div class="flex flex-col gap-2">
        <p-skeleton width="80%" height="0.85rem" />
        <p-skeleton width="60%" height="0.75rem" />
      </div>
      <div class="mt-3 flex justify-end gap-2">
        <p-skeleton width="96px" height="44px" borderRadius="8px" />
      </div>
    </div>
  }
</div>
