<div class="waiter">
  <h1 class="sr-only">{{ pageTitle() }}</h1>

  <div class="waiter__content">
    @switch (activeTab()) {
      @case ('menu') {
        <app-combos-waiter />
      }
      @case ('carta') {
        <app-products />
      }
      @case ('pedidos') {
        <app-today-orders />
      }
    }
  </div>
</div>
