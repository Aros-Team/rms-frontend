<app-rms-chart-frame
  title="Pedidos por hora"
  subtitle="Pedidos entregados en cada hora del día"
  [height]="120"
  [loading]="loading"
  [empty]="isEmpty"
  [error]="error"
  emptyMessage="Aún no hay pedidos entregados hoy"
  [summary]="summary"
  dataMode="disclosure"
  dataLabel="Ver pedidos por hora"
  (retry)="retry.emit()"
>
  <p-chart type="bar" [data]="data" [options]="options" ariaLabel="Pedidos entregados por hora del día" />
  <table rmsChartData>
    <caption class="sr-only">Pedidos entregados por hora del día</caption>
    <thead>
      <tr><th>Hora</th><th>Pedidos entregados</th></tr>
    </thead>
    <tbody>
      @for (row of rows; track row.hour) {
        <tr>
          <td>{{ row.label }}</td>
          <td>{{ row.delivered }}</td>
        </tr>
      }
    </tbody>
  </table>
</app-rms-chart-frame>
