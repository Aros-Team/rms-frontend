<div class="schedules-page">
  <h1 class="sr-only">Horarios</h1>

  @if (activeTab() === 'semana') {
    <div class="schedules-toolbar">
      <app-rms-button
        variant="secondary"
        iconStart="pi pi-calendar-plus"
        (click)="selectTab('turnos')">
        Gestionar turnos
      </app-rms-button>
    </div>

    <section class="schedules-page__panel">
      <app-week-grid
        [refreshToken]="shiftsVersion()"
        (createSchedule)="selectTab('turnos')"
      />
    </section>
  } @else {
    <div class="schedules-toolbar">
      <app-rms-button
        variant="secondary"
        iconStart="pi pi-arrow-left"
        (click)="selectTab('semana')">
        Volver a la semana
      </app-rms-button>
    </div>

    <section class="schedules-page__panel">
      <app-shift-planner (changed)="onShiftChanged()" />
    </section>
  }
</div>
