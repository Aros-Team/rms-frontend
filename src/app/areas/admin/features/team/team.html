<div class="team-layout">
    <!-- Horizontal Navigation -->
    <div class="team-nav-bar">
        <nav [attr.aria-label]="navLabel" class="team-nav-list icon-text-nav">
            <a [routerLink]="['/admin/team/workers']"
                #rla="routerLinkActive"
                routerLinkActive="team-nav-item-active"
                [routerLinkActiveOptions]="{ exact: false }"
                [attr.aria-current]="rla.isActive ? 'page' : null"
                class="team-nav-item nav-item">
                <i class="pi pi-users" aria-hidden="true"></i>
                <span class="nav-label">Empleados</span>
            </a>

            <a [routerLink]="['/admin/team/schedules']"
                #rla="routerLinkActive"
                routerLinkActive="team-nav-item-active"
                [routerLinkActiveOptions]="{ exact: true }"
                [attr.aria-current]="rla.isActive ? 'page' : null"
                class="team-nav-item nav-item">
                <i class="pi pi-calendar" aria-hidden="true"></i>
                <span class="nav-label">Horarios</span>
            </a>

            <a [routerLink]="['/admin/team/attendance']"
                #rla="routerLinkActive"
                routerLinkActive="team-nav-item-active"
                [routerLinkActiveOptions]="{ exact: true }"
                [attr.aria-current]="rla.isActive ? 'page' : null"
                class="team-nav-item nav-item">
                <i class="pi pi-clock" aria-hidden="true"></i>
                <span class="nav-label">Asistencia</span>
            </a>

            <a [routerLink]="['/admin/team/payroll']"
                #rla="routerLinkActive"
                routerLinkActive="team-nav-item-active"
                [routerLinkActiveOptions]="{ exact: true }"
                [attr.aria-current]="rla.isActive ? 'page' : null"
                class="team-nav-item nav-item">
                <i class="pi pi-wallet" aria-hidden="true"></i>
                <span class="nav-label">Nómina</span>
            </a>
        </nav>
    </div>

    <!-- Content -->
    <div class="team-content">
        <router-outlet />
    </div>
</div>
