<div class="flex flex-col p-4 md:p-6 min-w-0 min-h-0">
  <app-rms-page-header [compact]="true" title="Combinaciones especiales"> </app-rms-page-header>

  <!-- Content container -->
  <div class="flex-1 min-h-0 border border-rms-border rounded-2xl bg-rms-surface overflow-hidden">
    @if (isLoading()) {
      <app-table-skeleton />
    } @else {
      <p-table [value]="combos()">
        <ng-template pTemplate="caption">
          <div class="flex justify-end">
            <app-rms-button iconStart="pi pi-plus" (click)="navigateToNew()"
              >Nuevo combo</app-rms-button
            >
          </div>
        </ng-template>
        <ng-template pTemplate="header">
          <tr>
            <th>Nombre</th>
            <th>Precio Base</th>
            <th>Horario</th>
            <th>Activo</th>
            <th>Acciones</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-combo>
          <tr>
            <td>{{ combo.name }}</td>
            <td>{{ combo.basePrice | money }}</td>
            <td>{{ scheduleSummary(combo.schedule) }}</td>
            <td>
              <app-rms-status-pill
                [label]="combo.active ? 'Activo' : 'Inactivo'"
                [status]="combo.active ? 'success' : 'neutral'"
              />
            </td>
            <td>
              <div class="flex gap-1">
                <app-rms-icon-button
                  icon="pi pi-pencil"
                  [ariaLabel]="'Editar combo ' + combo.name"
                  tooltip="Editar"
                  (click)="navigateToEdit(combo.productId)"
                />
                <app-rms-icon-button
                  icon="pi pi-history"
                  [ariaLabel]="'Ver historial de ' + combo.name"
                  tooltip="Historial"
                  (click)="navigateToHistory(combo.productId)"
                />
                <app-rms-icon-button
                  icon="pi pi-calculator"
                  [ariaLabel]="'Sugerir precio para ' + combo.name"
                  tooltip="Precio sugerido"
                  (click)="suggestPrice()"
                />
              </div>
            </td>
          </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="5">
              <app-rms-empty-state
                icon="pi pi-box"
                title="No hay combos registrados"
                message="Crea un combo para agrupar productos con un precio especial."
                actionLabel="Nuevo combo"
                actionIcon="pi pi-plus"
                (action)="navigateToNew()"
              />
            </td>
          </tr>
        </ng-template>
      </p-table>
    }
  </div>
</div>
