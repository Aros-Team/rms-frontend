<div class="flex flex-col p-4 md:p-6 min-w-0 min-h-0 h-full" [appLazyLoad]="cache.areas" (appLazyLoadVisible)="onVisible()">
  <app-rms-page-header
    [compact]="true" title="Áreas de Trabajo">
    <div rmsPageHeaderActions>
      <app-rms-button iconStart="pi pi-plus" (click)="showCreateModal()">Nueva área</app-rms-button>
    </div>
  </app-rms-page-header>

  <div class="flex-1 min-h-0 border border-rms-border rounded-xl bg-rms-surface overflow-hidden">
    <p-table #dt [value]="areas()" [loading]="cache.areas.isLoading()" [showLoader]="false" [paginator]="true" [rows]="10" [scrollable]="true" scrollHeight="flex" responsiveLayout="scroll" styleClass="h-full" sortMode="multiple">
      <ng-template #header>
        <tr>
          <th class="text-xs md:text-sm" pSortableColumn="name">Nombre <p-sortIcon field="name" /></th>
          <th class="text-xs md:text-sm" pSortableColumn="type">Tipo <p-sortIcon field="type" /></th>
          <th class="text-xs md:text-sm">Estado</th>
          <th class="text-center text-xs md:text-sm">Acc.</th>
        </tr>
      </ng-template>
      <ng-template #body let-area>
        <tr>
          <td class="font-medium">{{ area.name }}</td>
          <td class="text-sm">{{ areaTypeLabel(area.type) }}</td>
          <td>
            <app-rms-status-pill
              [label]="area.enabled ? 'Activo' : 'Inactivo'"
              [status]="area.enabled ? 'success' : 'danger'" />
          </td>
          <td>
            <div class="flex gap-1 items-center justify-center">
              <app-rms-icon-button
                icon="pi pi-pencil"
                [ariaLabel]="'Editar área ' + area.name"
                (click)="showEditModal(area)" />
              <app-rms-icon-button
                icon="pi pi-power-off"
                [ariaLabel]="(area.enabled ? 'Desactivar área ' : 'Activar área ') + area.name"
                [variant]="area.enabled ? 'danger' : 'secondary'"
                (click)="toggleArea(area)" />
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template #loadingbody>
        <tr>
          <td colspan="4">
            <div class="min-h-[400px] w-full">
              <app-table-skeleton [rowCount]="6" [colCount]="4" />
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <tr>
          <td colspan="4" class="text-center">No hay áreas registradas</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<p-dialog 
  [header]="editMode ? 'Editar Área' : 'Nueva Área'" 
  [(visible)]="modalVisible" 
  [modal]="true"
  styleClass="w-[400px]"
>
  <form [formGroup]="form" class="flex flex-col gap-4">
    <app-rms-input id="name" label="Nombre" formControlName="name" [required]="true" [error]="fieldError('name')" />

    <app-rms-select
      id="type"
      label="Tipo de área"
      [options]="areaTypes"
      formControlName="type"
      placeholder="Seleccionar tipo"
      [required]="true"
      [error]="fieldError('type')" />
  </form>

  <ng-template pTemplate="footer">
    <app-rms-button variant="secondary" (click)="modalVisible = false">Cancelar</app-rms-button>
    <app-rms-button (click)="saveArea()">{{ editMode ? 'Actualizar' : 'Crear' }}</app-rms-button>
  </ng-template>
</p-dialog>
