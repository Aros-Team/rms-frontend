<app-rms-card padding="sm">
  <div class="flex flex-col gap-3">
    <div class="flex items-center gap-3">
      @if (worker().imageUrl; as imageUrl) {
        <img
          class="w-12 h-12 rounded-full object-cover flex-shrink-0"
          [src]="imageUrl"
          [alt]="'Foto de ' + worker().name" />
      } @else {
        <div class="w-12 h-12 rounded-full flex items-center justify-center font-bold text-lg flex-shrink-0 bg-rms-brand-soft text-rms-brand-text">
          {{ initials() }}
        </div>
      }
      <div class="min-w-0 flex-1">
        <h3 class="font-medium text-rms-ink truncate">{{ worker().name }}</h3>
        <p class="text-sm text-rms-ink-muted truncate">{{ worker().email }}</p>
      </div>
      <app-rms-status-pill [label]="statusLabel()" [status]="statusTone()" />
    </div>

    <div class="flex flex-col gap-2 text-sm">
      <div class="flex justify-between items-center">
        <span class="text-rms-ink-muted">Área</span>
        <span class="text-rms-ink-secondary font-medium">{{ areaName() }}</span>
      </div>
      <div class="flex justify-between items-center gap-3">
        <span class="text-rms-ink-muted">Horario</span>
        <span class="text-rms-ink-secondary font-medium text-right">{{ scheduleSummary() }}</span>
      </div>
      <div class="flex justify-between items-center">
        <span class="text-rms-ink-muted">Turnos</span>
        <app-rms-badge
          [label]="assignedSchedules().length + ' · ' + weeklyHoursLabel()"
          [tone]="assignedSchedules().length > 0 ? 'info' : 'neutral'" />
      </div>
    </div>

    <div class="flex gap-2 pt-2 border-t border-rms-border flex-wrap">
      <div class="flex-1 flex justify-center">
        <app-rms-icon-button
          icon="pi pi-calendar"
          ariaLabel="Asignar horarios"
          tooltip="Asignar horarios"
          (click)="onAssignSchedule()" />
      </div>
      <div class="flex-1 flex justify-center">
        <app-rms-icon-button
          icon="pi pi-pencil"
          ariaLabel="Editar trabajador"
          tooltip="Editar trabajador"
          (click)="onEdit()" />
      </div>
      @if (worker().status === 'PENDING') {
        <div class="flex-1 flex justify-center">
          <app-rms-icon-button
            icon="pi pi-envelope"
            ariaLabel="Reenviar invitación"
            tooltip="Reenviar invitación"
            (click)="onRetryEmail()" />
        </div>
      }
      <div class="flex-1 flex justify-center">
        <app-rms-icon-button
          icon="pi pi-history"
          ariaLabel="Ver historial salarial"
          tooltip="Ver historial salarial"
          [routerLink]="['/admin/manage/workers', worker().id, 'salary-history']" />
      </div>
      <div class="flex-1 flex justify-center">
        <app-rms-icon-button
          icon="pi pi-trash"
          ariaLabel="Eliminar trabajador"
          tooltip="Eliminar trabajador"
          variant="danger"
          (click)="onDelete()" />
      </div>
    </div>
  </div>
</app-rms-card>
