<h2 class="text-xl font-bold">Create product form</h2>
<div class="my-4"></div>

<div class="m-5">
  <form [formGroup]="form" (ngSubmit)="createProduct()">
    <input
      type="text"
      placeholder="name"
      formControlName="name"
      class="border rounded p-1 mb-2"
    />
    <br />
    <input
      type="number"
      placeholder="base price"
      formControlName="basePrice"
      class="border rounded p-1 mb-2"
    />
    <br />
    <input
      type="number"
      placeholder="estimated prep minutes"
      formControlName="estimatedPrepMinutes"
      class="border rounded p-1 mb-2"
    />
    <br />
    <textarea
      placeholder="description"
      formControlName="description"
      class="border rounded p-1 mb-2"
    ></textarea>
    <br />
    <select formControlName="categoryId" class="border rounded p-1 mb-2">
      <option [ngValue]="null" disabled>Select category</option>
      @for (category of categories(); track category.id) {
        <option [ngValue]="category.id">{{ category.name }}</option>
      }
    </select>
    <br />
    <select formControlName="areaId" class="border rounded p-1 mb-2">
      <option [ngValue]="null" disabled>Select preparation area</option>
      @for (area of areas(); track area.id) {
        <option [ngValue]="area.id">{{ area.name }}</option>
      }
    </select>
    <br />
    <button type="submit" class="rounded-xl px-4 py-1 bg-surface-800 text-surface-0 min-w-30">
      Send
    </button>
  </form>
</div>
