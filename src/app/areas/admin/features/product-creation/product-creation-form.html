<h2 class="rms-h2 mb-4">Crear producto</h2>

<div class="m-5">
  <form [formGroup]="form" (ngSubmit)="createProduct()" class="flex max-w-md flex-col gap-4">
    <app-rms-input label="Nombre" formControlName="name" />

    <div class="flex flex-col gap-1">
      <label class="rms-label" for="base-price">Precio base</label>
      <input
        id="base-price"
        type="number"
        formControlName="basePrice"
        class="w-full rounded-lg border border-rms-border bg-rms-surface p-2 text-rms-ink"
      />
    </div>

    <div class="flex flex-col gap-1">
      <label class="rms-label" for="prep-minutes">Minutos de preparación estimados</label>
      <input
        id="prep-minutes"
        type="number"
        formControlName="estimatedPrepMinutes"
        class="w-full rounded-lg border border-rms-border bg-rms-surface p-2 text-rms-ink"
      />
    </div>

    <app-rms-textarea label="Descripción" formControlName="description" />

    <div class="flex flex-col gap-1">
      <label class="rms-label" for="category-id">Categoría</label>
      <select
        id="category-id"
        formControlName="categoryId"
        class="w-full rounded-lg border border-rms-border bg-rms-surface p-2 text-rms-ink"
      >
        <option [ngValue]="null" disabled>Seleccionar categoría</option>
        @for (category of categories(); track category.id) {
          <option [ngValue]="category.id">{{ category.name }}</option>
        }
      </select>
    </div>

    <div class="flex flex-col gap-1">
      <label class="rms-label" for="area-id">Área de preparación</label>
      <select
        id="area-id"
        formControlName="areaId"
        class="w-full rounded-lg border border-rms-border bg-rms-surface p-2 text-rms-ink"
      >
        <option [ngValue]="null" disabled>Seleccionar área de preparación</option>
        @for (area of areas(); track area.id) {
          <option [ngValue]="area.id">{{ area.name }}</option>
        }
      </select>
    </div>

    <div>
      <app-rms-button type="submit" iconStart="pi pi-check">Crear producto</app-rms-button>
    </div>
  </form>
</div>
