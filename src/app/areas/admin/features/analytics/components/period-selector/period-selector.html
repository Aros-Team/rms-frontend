@if (variant() === 'docked') {
  <div id="period-dock-form" class="period-dock">
    @if (expanded()) {
      <form class="period-dock__form" (submit)="$event.preventDefault(); apply()">
        <div class="period-field period-field--select">
          <app-rms-select
            label="Agrupar por"
            [options]="bucketOptions"
            [ngModel]="bucket()"
            (ngModelChange)="onBucketChange($event)"
            [ngModelOptions]="{ standalone: true }"
            size="sm" />
        </div>
        <div class="period-field period-field--select">
          <app-rms-select
            label="Rango"
            [options]="presetOptions()"
            [ngModel]="preset()"
            (ngModelChange)="onPresetChange($event)"
            [ngModelOptions]="{ standalone: true }"
            size="sm" />
        </div>
        <div class="period-field">
          <label for="period-from" class="period-label">Desde</label>
          <input
            id="period-from"
            class="period-input"
            [ngModel]="from()"
            (ngModelChange)="onFromChange($event)"
            [ngModelOptions]="{ standalone: true }"
            [placeholder]="formatHint()"
            [attr.aria-invalid]="!fromValid()"
            autocomplete="off" />
        </div>
        <div class="period-field">
          <label for="period-to" class="period-label">Hasta</label>
          <input
            id="period-to"
            class="period-input"
            [ngModel]="to()"
            (ngModelChange)="onToChange($event)"
            [ngModelOptions]="{ standalone: true }"
            [placeholder]="formatHint()"
            [attr.aria-invalid]="!toValid()"
            autocomplete="off" />
        </div>
        <div class="period-actions">
          <app-rms-button type="submit" size="sm" iconStart="pi pi-check" [disabled]="!!errorMessage()">
            Aplicar
          </app-rms-button>
          <app-rms-button variant="secondary" size="sm" iconStart="pi pi-refresh" (click)="reset()">
            Restablecer
          </app-rms-button>
        </div>
        <app-rms-icon-button
          class="period-close"
          icon="pi pi-chevron-up"
          ariaLabel="Cerrar selector de periodo"
          tooltip="Cerrar"
          (click)="collapse()" />
        @if (errorMessage(); as message) {
          <p class="period-error" role="alert">{{ message }}</p>
        }
      </form>
    } @else {
      <div class="period-dock__summary">
        <button
          type="button"
          class="period-dock__range"
          (click)="toggle()"
          [attr.aria-expanded]="expanded()"
          aria-controls="period-dock-form">
          <i class="pi pi-calendar" aria-hidden="true"></i>
          <span class="period-dock__caption">Periodo</span>
          <span class="period-dock__value">{{ currentRangeLabel() }}</span>
          <span class="period-dock__bucket">{{ bucketName() }}</span>
          <span class="sr-only">Cambiar periodo de análisis</span>
        </button>
        <app-rms-icon-button
          icon="pi pi-refresh"
          ariaLabel="Actualizar datos"
          tooltip="Actualizar datos"
          (click)="refreshActive()" />
        <app-rms-icon-button
          icon="pi pi-chevron-down"
          ariaLabel="Expandir selector de periodo"
          tooltip="Cambiar periodo"
          (click)="toggle()" />
      </div>
    }
  </div>
} @else {
  <div class="period-inline" role="group" aria-label="Selector de periodo">
    <div class="period-field period-field--select">
      <app-rms-select
        label="Agrupar por"
        [options]="bucketOptions"
        [ngModel]="bucket()"
        (ngModelChange)="onBucketChange($event)"
        size="sm" />
    </div>
    <div class="period-field period-field--select">
      <app-rms-select
        label="Rango"
        [options]="presetOptions()"
        [ngModel]="preset()"
        (ngModelChange)="onPresetChange($event)"
        size="sm" />
    </div>
    <div class="period-field">
      <label for="period-from" class="period-label">Desde</label>
      <input
        id="period-from"
        class="period-input"
        [ngModel]="from()"
        (ngModelChange)="onFromChange($event)"
        [placeholder]="formatHint()"
        [attr.aria-invalid]="!fromValid()"
        autocomplete="off" />
    </div>
    <div class="period-field">
      <label for="period-to" class="period-label">Hasta</label>
      <input
        id="period-to"
        class="period-input"
        [ngModel]="to()"
        (ngModelChange)="onToChange($event)"
        [placeholder]="formatHint()"
        [attr.aria-invalid]="!toValid()"
        autocomplete="off" />
    </div>
    <div class="period-actions">
      <app-rms-button size="sm" iconStart="pi pi-check" [disabled]="!!errorMessage()" (click)="apply()">
        Aplicar
      </app-rms-button>
      <app-rms-button variant="secondary" size="sm" iconStart="pi pi-refresh" (click)="reset()">
        Restablecer
      </app-rms-button>
    </div>
    @if (errorMessage(); as message) {
      <p class="period-error period-error--inline" role="alert">{{ message }}</p>
    }
  </div>
}
