<div class="flex w-full flex-col gap-4">
  <h1 class="text-xl font-bold text-center text-surface-900 dark:text-surface-100">Recuperar Contraseña</h1>

  <div class="text-center">
    <p class="text-muted text-sm">
      Ingresa tu correo electrónico y te enviaremos un enlace para recuperar tu contraseña.
    </p>
  </div>

  @if (success()) {
    <div class="mb-4">
      <p-message severity="success" text="Si el correo existe, recibirás un enlace de recuperación pronto."></p-message>
    </div>

    <p-button
      label="Volver al Login"
      class="mt-4 m-auto"
      (onClick)="goToLogin()">
    </p-button>
  } @else {
    @if (error()) {
      <div class="mb-4">
        <p-message severity="error" [text]="error()!"></p-message>
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-8 mt-8">
      <div class="w-full">
        <label for="email" class="text-sm">Correo electrónico</label>
        <input
          pInputText
          id="email"
          type="email"
          formControlName="email"
          class="w-full"
          [invalid]="isInvalid('email')"
        />
        @if (isInvalid('email')) {
          <div class="text-red-500 text-sm">
            Campo requerido*
          </div>
        }
      </div>

      <p-button
        type="submit"
        class="mt-4 m-auto"
        [disabled]="form.invalid || loading()"
        [loading]="loading()"
      >
        @if (!loading()) {
          <span>Enviar Enlace</span>
        }
      </p-button>

      <div class="text-center mt-4">
        <a
          [routerLink]="['/login']"
          class="text-sm text-muted hover:text-surface-900 dark:hover:text-surface-100"
        >
          Cancelar
        </a>
      </div>
    </form>
  }
</div>
