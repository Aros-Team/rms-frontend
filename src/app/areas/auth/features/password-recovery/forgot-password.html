<div class="flex w-full flex-col gap-5">
  <div class="flex flex-col gap-1 text-center">
    <h1 class="rms-h1 text-rms-ink">Recuperar Contraseña</h1>
    <p class="rms-body text-rms-ink-muted">
      Ingresa tu correo electrónico y te enviaremos un enlace para recuperar tu contraseña.
    </p>
  </div>

  @if (success()) {
    <p-message
      severity="success"
      text="Si el correo existe, recibirás un enlace de recuperación pronto."
    ></p-message>

    <app-rms-button type="button" size="lg" [block]="true" (click)="goToLogin()">
      Volver a iniciar sesión
    </app-rms-button>
  } @else {
    @if (error()) {
      <p-message severity="error" [text]="error()!"></p-message>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-5" novalidate>
      <app-rms-input
        id="email"
        type="email"
        formControlName="email"
        label="Correo electrónico"
        placeholder="usuario@dominio.com"
        autocomplete="email"
        [error]="emailError"
        [required]="true"
      />

      <app-rms-button
        type="submit"
        size="lg"
        iconEnd="pi pi-arrow-right"
        [disabled]="form.invalid"
        [loading]="loading()"
        [block]="true"
      >
        Enviar Enlace
      </app-rms-button>

      <a
        [routerLink]="['/login']"
        class="inline-flex min-h-11 items-center justify-center text-sm text-rms-brand-text underline underline-offset-2 hover:text-rms-ink"
      >
        Cancelar
      </a>
    </form>
  }
</div>
