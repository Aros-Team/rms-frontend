<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [closable]="true"
  header="Cambiar Contraseña"
  styleClass="w-[450px]"
  (onHide)="onDialogHide()"
>
  <div class="flex flex-col gap-4">
    @if (success()) {
      <p-message severity="success" text="Contraseña actualizada correctamente"></p-message>
    }

    @if (error()) {
      <p-message severity="error" [text]="error()!"></p-message>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4" novalidate>
      <div class="flex flex-col gap-2">
        <label for="currentPassword" class="rms-label text-rms-ink">Contraseña Actual</label>
        <p-password
          inputId="currentPassword"
          formControlName="currentPassword"
          [toggleMask]="true"
          [feedback]="false"
          placeholder="Ingresa tu contraseña actual"
          autocomplete="current-password"
          fluid
          ariaLabel="Contraseña actual"
        />
      </div>

      <div class="flex flex-col gap-2">
        <label for="newPassword" class="rms-label text-rms-ink">Nueva Contraseña</label>
        <p-password
          inputId="newPassword"
          formControlName="newPassword"
          [toggleMask]="true"
          [feedback]="false"
          placeholder="Ingresa la nueva contraseña"
          autocomplete="new-password"
          fluid
          ariaLabel="Nueva contraseña"
        />
      </div>

      <div class="flex flex-col gap-2">
        <label for="confirmPassword" class="rms-label text-rms-ink"
          >Confirmar Nueva Contraseña</label
        >
        <p-password
          inputId="confirmPassword"
          formControlName="confirmPassword"
          [toggleMask]="true"
          [feedback]="false"
          placeholder="Confirma la nueva contraseña"
          autocomplete="new-password"
          fluid
          ariaLabel="Confirmar contraseña"
        />
      </div>

      <!-- Password requirements -->
      <div class="rounded-lg border border-rms-border bg-rms-subtle p-4">
        <h2 class="rms-h4 text-rms-ink">Requisitos de contraseña</h2>
        <ul class="mt-2 flex list-none flex-col gap-2 p-0">
          <li
            class="flex items-center gap-2 text-sm"
            [ngClass]="
              checkPasswordRequirement('minLength') ? 'text-rms-success' : 'text-rms-ink-muted'
            "
          >
            <i
              class="pi text-xs"
              [ngClass]="checkPasswordRequirement('minLength') ? 'pi-check-circle' : 'pi-circle'"
              aria-hidden="true"
            ></i>
            Mínimo 8 caracteres
          </li>
          <li
            class="flex items-center gap-2 text-sm"
            [ngClass]="
              checkPasswordRequirement('upperCase') ? 'text-rms-success' : 'text-rms-ink-muted'
            "
          >
            <i
              class="pi text-xs"
              [ngClass]="checkPasswordRequirement('upperCase') ? 'pi-check-circle' : 'pi-circle'"
              aria-hidden="true"
            ></i>
            Al menos 1 mayúscula
          </li>
          <li
            class="flex items-center gap-2 text-sm"
            [ngClass]="
              checkPasswordRequirement('lowerCase') ? 'text-rms-success' : 'text-rms-ink-muted'
            "
          >
            <i
              class="pi text-xs"
              [ngClass]="checkPasswordRequirement('lowerCase') ? 'pi-check-circle' : 'pi-circle'"
              aria-hidden="true"
            ></i>
            Al menos 1 minúscula
          </li>
          <li
            class="flex items-center gap-2 text-sm"
            [ngClass]="
              checkPasswordRequirement('number') ? 'text-rms-success' : 'text-rms-ink-muted'
            "
          >
            <i
              class="pi text-xs"
              [ngClass]="checkPasswordRequirement('number') ? 'pi-check-circle' : 'pi-circle'"
              aria-hidden="true"
            ></i>
            Al menos 1 número
          </li>
          <li
            class="flex items-center gap-2 text-sm"
            [ngClass]="
              checkPasswordRequirement('symbol') ? 'text-rms-success' : 'text-rms-ink-muted'
            "
          >
            <i
              class="pi text-xs"
              [ngClass]="checkPasswordRequirement('symbol') ? 'pi-check-circle' : 'pi-circle'"
              aria-hidden="true"
            ></i>
            Al menos 1 símbolo (ej. ! @ # $ _ -)
          </li>
        </ul>
      </div>
    </form>
  </div>

  <ng-template pTemplate="footer">
    <div class="flex justify-end gap-2">
      <app-rms-button variant="secondary" size="lg" (click)="closeDialog()">
        Cancelar
      </app-rms-button>
      <app-rms-button
        size="lg"
        (click)="onSubmit()"
        [loading]="loading()"
        [disabled]="form.invalid"
      >
        Cambiar Contraseña
      </app-rms-button>
    </div>
  </ng-template>
</p-dialog>
