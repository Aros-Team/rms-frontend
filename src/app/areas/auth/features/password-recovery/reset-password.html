<div class="mx-auto mt-8 flex flex-col gap-4 w-[400px]">
  <h1 class="text-xl font-bold text-center text-surface-700 mb-6">Restablecer Contraseña</h1>
  @if (success()) {
    <div class="mb-4">
      <p-message severity="success" text="Tu contraseña ha sido restablecida correctamente."></p-message>
    </div>

    <button
      pButton
      label="Ir al Login"
      class="mt-4 m-auto"
      (click)="goToLogin()">
    </button>
  } @else {
    @if (error()) {
      <div class="mb-4">
        <p-message severity="error" [text]="error()!"></p-message>
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="w">

     <div class="flex flex-col gap-2 mb-6">
        <label for="newPassword" class="text-sm text-surface-700">Nueva Contraseña</label>
        <p-password
          id="newPassword"
          formControlName="newPassword"
          [toggleMask]="false"
          [feedback]="false"
          placeholder="••••••••"
          ariaLabel="Nueva contraseña"
        />
      </div>

      <div class="flex flex-col gap-2 mb-6">
        <label for="confirmPassword" class="text-sm text-surface-700">Confirmar Nueva Contraseña</label>
        <p-password
          id="confirmPassword"
          formControlName="confirmPassword"
          [toggleMask]="false"
          [feedback]="false"
          placeholder="••••••••"
          ariaLabel="Confirmar contraseña"
        />
      </div>

      <div class="password-requirements">
        <h4 class="font-semibold mb-4">Requisitos de contraseña:</h4>
        <ul>
          <li [class.valid]="checkPasswordRequirement('minLength')">
            <i class="pi" [ngClass]="checkPasswordRequirement('minLength') ? 'pi-check' : 'pi-times'"></i>
            Mínimo 8 caracteres
          </li>
          <li [class.valid]="checkPasswordRequirement('upperCase')">
            <i class="pi" [ngClass]="checkPasswordRequirement('upperCase') ? 'pi-check' : 'pi-times'"></i>
            Al menos 1 mayúscula
          </li>
          <li [class.valid]="checkPasswordRequirement('lowerCase')">
            <i class="pi" [ngClass]="checkPasswordRequirement('lowerCase') ? 'pi-check' : 'pi-times'"></i>
            Al menos 1 minúscula
          </li>
          <li [class.valid]="checkPasswordRequirement('number')">
            <i class="pi" [ngClass]="checkPasswordRequirement('number') ? 'pi-check' : 'pi-times'"></i>
            Al menos 1 número
          </li>
          <li [class.valid]="checkPasswordRequirement('symbol')">
            <i class="pi" [ngClass]="checkPasswordRequirement('symbol') ? 'pi-check' : 'pi-times'"></i>
            Al menos 1 símbolo (@$!%*?&)
          </li>
        </ul>
      </div>

      <div class="flex flex-col gap-3 items-center">
        <button
          pButton
          type="submit"
          label="Cambiar Contraseña"
          class="w-full"
          [loading]="loading()"
          [disabled]="form.invalid">
        </button>
        <button
          pButton
          type="button"
          label="Cancelar"
          class="p-button-outlined w-full"
          (click)="goToLogin()">
        </button>
      </div>
    </form>
  }
</div>
