<div class="flex w-full flex-col gap-6">
  <div class="flex flex-col items-center gap-3 text-center">
    <div class="flex h-16 w-16 items-center justify-center rounded-full bg-rms-brand">
      <i class="pi pi-shield text-2xl text-rms-on-brand" aria-hidden="true"></i>
    </div>
    <h1 class="rms-h1 text-rms-ink">Verificación en Dos Pasos</h1>
    <p class="rms-body text-rms-ink-muted">
      Ingresa el código de 6 dígitos enviado a tu correo electrónico
    </p>
  </div>

  @if (errorMessage) {
    <div class="rms-status-surface--danger flex items-center gap-3 rounded-xl border p-4" role="alert">
      <i class="pi pi-exclamation-circle text-xl" aria-hidden="true"></i>
      <span class="text-sm">{{ errorMessage }}</span>
    </div>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-5" novalidate>
    <app-rms-input
      id="code"
      type="text"
      formControlName="code"
      label="Código de Verificación"
      placeholder="------"
      inputMode="numeric"
      autocomplete="one-time-code"
      [maxLength]="6"
      [error]="codeError"
      [required]="true"
    />

    <app-rms-button
      type="submit"
      size="lg"
      ariaLabel="Verificar Código"
      [loading]="formStatus() === 'Occuped'"
      [disabled]="form.invalid"
      [block]="true"
    >
      Verificar Código
    </app-rms-button>
  </form>

  <div class="flex flex-col items-center gap-2 border-t border-rms-border pt-4">
    <p class="text-sm text-rms-ink-muted">¿No recibiste el código?</p>
    <app-rms-button
      type="button"
      variant="ghost"
      size="lg"
      ariaLabel="Volver a iniciar sesión"
      (click)="goBack()"
    >
      Volver a iniciar sesión
    </app-rms-button>
  </div>

  <p class="text-center text-xs text-rms-ink-muted">El código expira en 5 minutos</p>
</div>
