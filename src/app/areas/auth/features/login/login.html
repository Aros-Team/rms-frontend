
<form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-5 w-full">
  <h1 class="text-xl font-bold text-surface-900 dark:text-surface-100">Iniciar sesión</h1>

  <!-- Email -->
  <div class="flex flex-col gap-1.5">
    <label for="username" class="text-sm font-medium text-surface-700 dark:text-surface-300">Correo electrónico</label>
    <div class="relative">
      <input
        pInputText
        id="username"
        type="email"
        formControlName="username"
        [invalid]="isInvalid('username')"
        placeholder="usuario@dominio.com"
        autocomplete="username"
        class="w-full pl-10"
      />

    </div>
    @if (isInvalid('username')) {
      <small class="text-red-600 dark:text-red-400">Campo requerido</small>
    }
  </div>

  <!-- Password -->
  <div class="flex flex-col gap-1.5">
    <label for="password" class="text-sm text-surface-700 dark:text-surface-300">Contraseña</label>
    <p-password
      id="password"
      formControlName="password"
      [invalid]="isInvalid('password')"
      [feedback]="false"
      [toggleMask]="true"
      placeholder="••••••••"
      fluid
      autocomplete="current-password"
      ariaLabel="Contraseña"
    />
    @if (isInvalid('password')) {
      <small class="text-red-600 dark:text-red-400">Campo requerido</small>
    }
  </div>

  <!-- Terms Checkbox + Forgot password -->
  <!-- The terms trigger must NOT live inside the <label>: interactive content
       inside a label is invalid and clicking it also toggled the checkbox. -->
  <div class="flex flex-col gap-2 -mt-1">
    <div class="flex items-center gap-2 min-w-0">
      <p-checkbox
        formControlName="termsAccepted"
        [binary]="true"
        inputId="terms"
      />
      <span class="text-sm whitespace-nowrap text-muted">
        <label for="terms" class="cursor-pointer">Acepto los&nbsp;</label>
        <button
          type="button"
          (click)="showHabeasData()"
          class="underline cursor-pointer bg-transparent border-none p-0 text-sm text-surface-700 dark:text-surface-200"
        >
          términos y condiciones
        </button>
      </span>
    </div>
    <a
      [routerLink]="['/forgot-password']"
      class="text-sm underline whitespace-nowrap text-surface-700 dark:text-surface-300"
    >
      ¿Olvidaste tu contraseña?
    </a>
  </div>

  <!-- Submit -->
  <p-button
    type="submit"
    class="mt-2"
    [disabled]="formStatus() === 'Occuped' || form.invalid"
    [loading]="formStatus() === 'Occuped'"
    styleClass="w-full justify-center gap-2"
  >
    @if (formStatus() === 'Free') {
      <span class="flex items-center gap-2">
        Entrar al sistema
        <i class="pi pi-arrow-right" aria-hidden="true"></i>
      </span>
    }
    @if (formStatus() === 'Occuped') {
      <span>Autenticando...</span>
    }
  </p-button>

  <!-- Restricted Access Note -->
  <div class="mt-8 pt-4 border-t border-surface-200 dark:border-surface-700">
    <p class="text-center text-xs text-muted">Acceso restringido a personal autorizado</p>
  </div>
</form>
