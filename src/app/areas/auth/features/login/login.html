<form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex w-full flex-col gap-5" novalidate>
  <div class="flex flex-col gap-1">
    <h1 class="rms-h1 text-rms-ink">Iniciar sesión</h1>
    <p class="rms-body text-rms-ink-muted">Ingresa con tu correo y contraseña.</p>
  </div>

  <app-rms-input
    id="username"
    type="email"
    formControlName="username"
    label="Correo electrónico"
    placeholder="usuario@dominio.com"
    autocomplete="username"
    [error]="usernameError"
    [required]="true"
  />

  <div class="flex flex-col gap-2">
    <label for="password" class="rms-label text-rms-ink">Contraseña</label>
    <p-password
      inputId="password"
      formControlName="password"
      [invalid]="isInvalid('password')"
      [feedback]="false"
      [toggleMask]="true"
      placeholder="••••••••"
      fluid
      autocomplete="current-password"
      ariaLabel="Contraseña"
    />
    @if (passwordError) {
      <p class="rms-text-danger text-sm" role="alert">{{ passwordError }}</p>
    }
  </div>

  <!-- The terms trigger lives outside the checkbox label: interactive content
       inside a <label> is invalid and clicking it also toggled the checkbox. -->
  <div class="flex flex-col gap-1 border-t border-rms-border pt-4">
    <app-rms-checkbox
      formControlName="termsAccepted"
      label="Acepto los términos y condiciones"
    />
    <button
      type="button"
      (click)="showHabeasData()"
      class="min-h-11 self-start text-left text-sm text-rms-brand-text underline underline-offset-2 hover:text-rms-ink"
    >
      Leer los términos y condiciones
    </button>
    <a
      [routerLink]="['/forgot-password']"
      class="inline-flex min-h-11 items-center self-start text-sm text-rms-brand-text underline underline-offset-2 hover:text-rms-ink"
    >
      ¿Olvidaste tu contraseña?
    </a>
  </div>

  <app-rms-button
    type="submit"
    size="lg"
    iconEnd="pi pi-arrow-right"
    [disabled]="form.invalid"
    [loading]="formStatus() === 'Occuped'"
    [block]="true"
  >
    Entrar al sistema
  </app-rms-button>

  <div class="border-t border-rms-border pt-4">
    <p class="text-center text-xs text-rms-ink-muted">Acceso restringido a personal autorizado</p>
  </div>
</form>
